[workspace]
resolver = "2"
members = [
    "crates/oli_diag",
    "crates/oli_lexer",
    "crates/oli_ast",
    "crates/oli_parser",
    "crates/oli_sema",
    "crates/olic",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oli-lang/oli"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# The compiler must never panic on user input.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
debug = 1
